<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NICE평가정보 - CheckPlus 안심본인인증 테스트</title>
</head>
<body onload="document.getElementById('form_chk').submit()">
<form id="form_chk" method="post"
      action="https://nice.checkplus.co.kr/CheckPlusSafeModel/checkplus.cb"
      accept-charset="utf-8" target="_self" autocomplete="off">
    <input type="hidden" id="m" name="m" value="service">
    <input type="hidden" id="token_version_id" name="token_version_id" th:value="${niceForm.tokenVersionId}">
    <input type="hidden" id="enc_data" name="enc_data"          th:value="${niceForm.plainEncrypt}">
    <input type="hidden" id="integrity_value" name="integrity_value"   th:value="${niceForm.plainHmacEncrypt}">
</form>
</body>
</html>
