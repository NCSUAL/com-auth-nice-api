// NICE 본인인증 서버 실행 모듈 (omnibus-account.jar)
jar {
    enabled = true
}

bootJar {
    enabled = true
    archiveFileName = "omnibus-account.jar"
}

dependencies {
    //webflux 기반
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	//실시간 핫 리로딩
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation project(":service:common-service")
    implementation project(":domain:domain-redis-reactive")
    implementation project(":domain:domain-account-core")
    implementation project(":domain:domain-auth-core")
    implementation project(":client:nice-client")
    implementation project(":client:http-client")
}
